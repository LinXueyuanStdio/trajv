<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="TrajV JSONL Viewer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1f22"/>
      <stop offset="100%" stop-color="#2a2d31"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3d82f6"/>
      <stop offset="100%" stop-color="#1d5fd1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background card -->
  <rect x="12" y="12" width="232" height="232" rx="28" fill="url(#bg)" stroke="#3a3f45" stroke-width="1"/>

  <!-- Left JSONL bullets + lines -->
  <g transform="translate(44,64)">
    <g>
      <circle cx="8" cy="8" r="4" fill="url(#line)"/>
      <rect x="20" y="4" width="92" height="8" rx="4" fill="#4a9bff" opacity="0.95"/>
    </g>
    <g transform="translate(0,24)">
      <circle cx="8" cy="8" r="4" fill="url(#line)"/>
      <rect x="20" y="4" width="112" height="8" rx="4" fill="#80b6ff" opacity="0.9"/>
    </g>
    <g transform="translate(0,48)">
      <circle cx="8" cy="8" r="4" fill="url(#line)"/>
      <rect x="20" y="4" width="76" height="8" rx="4" fill="#4a9bff" opacity="0.9"/>
    </g>
    <g transform="translate(0,72)">
      <circle cx="8" cy="8" r="4" fill="url(#line)"/>
      <rect x="20" y="4" width="124" height="8" rx="4" fill="#b7d4ff" opacity="0.85"/>
    </g>
  </g>

  <!-- Right curly braces to hint JSON structure -->
  <g transform="translate(150,60)" filter="url(#shadow)">
    <text x="0" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="120" font-weight="700" fill="#8ab4f8" opacity="0.95">{</text>
  </g>
  <g transform="translate(180,60)" filter="url(#shadow)">
    <text x="0" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="120" font-weight="700" fill="#8ab4f8" opacity="0.95">}</text>
  </g>

  <!-- Title pill -->
  <g transform="translate(24,196)">
    <rect x="0" y="0" rx="10" width="208" height="36" fill="#101317" stroke="#3a3f45"/>
    <text x="12" y="24" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#cdd3d8">TrajV · JSONL Viewer</text>
  </g>
</svg>