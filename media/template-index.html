    // --- Stream JSONL from File to support very large files ---
    async function parseJSONLFile(file,onProgress){
      const reader = file.stream().getReader();
      const decoder = new TextDecoder();
      let {value,done} = await reader.read();
      let buffer = '';
      const steps=[];
      let lineNo=0;
      let lastTick=0;
      function pushLine(line){
        const trimmed=line.trim();
        if(!trimmed) return;
        try{
          const obj=JSON.parse(trimmed);
          const inference=obj.inference_args||obj.inferenceArgs||{};
          let tools=obj.tools||[];
          if((!tools||!tools.length)&&inference&&Array.isArray(inference.tools)&&inference.tools.length) tools=inference.tools;

          // Handle messages field fallback logic
          let inputMessages = obj.input_messages || obj.inputMessages || [];
          let outputMessages = obj.output_messages || obj.outputMessages || [];

          // If no input_messages/output_messages, fall back to messages field
          if (inputMessages.length === 0 && outputMessages.length === 0 && obj.messages && Array.isArray(obj.messages) && obj.messages.length > 0) {
            // Last message is output, rest are input
            if (obj.messages.length === 1) {
              outputMessages = obj.messages;
            } else {
              inputMessages = obj.messages.slice(0, -1);
              outputMessages = [obj.messages[obj.messages.length - 1]];
            }
          }

          const stepObj={
            url:obj.url||'',
            input_messages:inputMessages,
            output_messages:outputMessages,
            inference_args:inference,
            tools:tools||[],
            is_answer:obj.is_answer||obj.isAnswer||false,
            turn:obj.turn??0,
            step:obj.step??(steps.length),
            meta:obj.meta||{}
          };
          if(obj.edited_input_messages) stepObj.edited_input_messages=obj.edited_input_messages;
          if(obj.edited_output_messages) stepObj.edited_output_messages=obj.edited_output_messages;
          if(obj.edited_tools) stepObj.edited_tools=obj.edited_tools;
          steps.push(stepObj);
        }catch(e){ console.warn('跳过无效 JSON 行',lineNo,e); }
      }
      while(!done){
        buffer += decoder.decode(value,{stream:true});
        let idx;
        while((idx=buffer.indexOf('\n'))!==-1){
          const line = buffer.slice(0,idx);
          buffer = buffer.slice(idx+1);
          lineNo++;
          pushLine(line);
        }
        const now=performance.now();
        if(typeof onProgress==='function' && now-lastTick>200){
          lastTick=now;
          try{ onProgress({lines:lineNo,steps:steps.length}); }catch{}
        }
        ({value,done}=await reader.read());
      }
      // flush remaining
      buffer += decoder.decode();
      if(buffer.length){ lineNo++; pushLine(buffer); }
      if(typeof onProgress==='function'){
        try{ onProgress({lines:lineNo,steps:steps.length,done:true}); }catch{}
      }
      return {steps};
    }
  async function loadSelectedFiles(){

  // --- Build edit area using svelte-jsoneditor ---
  function buildEditArea(stepObj,side){

    function setupButtons() {
      save.onclick = async () => {
        if (!editor) return;
        try {
          const content = await editor.get();
          const parsed = content.json;

          if (!Array.isArray(parsed)) {
            statusSpan.textContent = 'ERR: ' + t('invalidRootArray');
            statusSpan.className = 'editor-status err';
            return;
          }

          if(side==='input') {
            stepObj.edited_input_messages=parsed;
          } else {
            stepObj.edited_output_messages=parsed;
          }
          render();
        } catch(e) {
          statusSpan.textContent = 'ERR: ' + e.message;
          statusSpan.className = 'editor-status err';
        }
      };

      reset.onclick = () => {
        if (!editor) return;
        if(side==='input') {
          delete stepObj.edited_input_messages;
        } else {
          delete stepObj.edited_output_messages;
        }
        editor.set({ json: original });

      cancel.onclick = () => {
        if(side==='input') {

        } else {
          state.outputMode='rich';
        }
        updateModeButtonsUI();
        render();
      };
    }

    return box;

  // Load file from URL parameter (supports both remote URLs and local file:// paths)
  async function loadFileFromUrl(url, retryCount = 0) {
    try {
      const isLocalFile = url.startsWith('file://') || url.startsWith('/');
      const displayUrl = isLocalFile ? url.replace('file://', '') : url;

      console.log('[loadFileFromUrl] Loading:', url, 'retry:', retryCount);
      setStatus(`正在加载文件: ${displayUrl}`, true);
      statusEl.style.display = '';

      let fetchUrl = url;

      // For GitHub URLs, try multiple strategies
      if (url.includes('github.com')) {
        if (retryCount === 0) {
          // Strategy 1: Convert to jsdelivr CDN
          const githubMatch = url.match(/github\.com\/([^\/]+)\/([^\/]+)\/(?:blob|raw)\/(?:refs\/heads\/)?([^\/]+)\/(.+)/);
          if (githubMatch) {
            const [, user, repo, branch, path] = githubMatch;
            fetchUrl = `https://cdn.jsdelivr.net/gh/${user}/${repo}@${branch}/${path}`;
            console.log('[loadFileFromUrl] Using jsdelivr:', fetchUrl);
            setStatus(`正在通过 jsdelivr CDN 加载...`, true);
          }
        } else if (retryCount === 1) {
          // Strategy 2: Use raw.githubusercontent.com
          const githubMatch = url.match(/github\.com\/([^\/]+)\/([^\/]+)\/(?:blob|raw)\/(?:refs\/heads\/)?([^\/]+)\/(.+)/);
          if (githubMatch) {
            const [, user, repo, branch, path] = githubMatch;
            fetchUrl = `https://raw.githubusercontent.com/${user}/${repo}/${branch}/${path}`;
            console.log('[loadFileFromUrl] Using raw.githubusercontent:', fetchUrl);
            setStatus(`正在通过 raw.githubusercontent.com 加载...`, true);
          }
        } else if (retryCount === 2) {
          // Strategy 3: Direct fetch with no-cors mode as last resort
          fetchUrl = url.replace('/blob/', '/raw/');
          console.log('[loadFileFromUrl] Direct raw fetch:', fetchUrl);
          setStatus(`正在直接加载...`, true);
        }
      }

      console.log('[loadFileFromUrl] Fetching:', fetchUrl);
      const response = await fetch(fetchUrl, {
        mode: 'cors',
        cache: 'default'
      });

      console.log('[loadFileFromUrl] Response status:', response.status, response.statusText);
      if (!response.ok) {
        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
      }

      const blob = await response.blob();
      console.log('[loadFileFromUrl] Blob size:', blob.size, 'type:', blob.type);

      const filename = url.split('/').pop().split('?')[0] || 'loaded.rollout.jsonl';

      // Create a File object from the blob
      const file = new File([blob], filename, { type: 'application/jsonl' });

      setStatus(`正在解析: ${filename}`, true);
      const {steps} = await parseJSONLFile(file, (p) => {
        setStatus(`解析 ${filename} … ${p.steps || 0} steps`, true);
      });

      console.log('[loadFileFromUrl] Parsed steps:', steps.length);
      const mtime = Date.now();
      state.files.set(filename, {steps, mtime});
      state.currentFile = filename;

      refreshFileSelect();
      setStatus(`成功加载: ${filename} (${steps.length} steps)`, true);
      setTimeout(() => {
        statusEl.style.display = 'none';
      }, 2000);
      enterCompact();
    } catch (e) {
      console.error('[loadFileFromUrl] Error:', e);
      const isLocalFile = url.startsWith('file://') || url.startsWith('/');
      const isRemoteUrl = url.startsWith('http://') || url.startsWith('https://');

      if (isLocalFile && (e.message.includes('Failed to fetch') || e.message.includes('NetworkError'))) {
        setStatus(`⚠️ 浏览器安全限制：无法直接访问本地文件。请使用 HTTP 服务器访问此页面（如: python -m http.server 8000），然后使用相对路径或上方按钮选择文件。`, false);
      } else if (isRemoteUrl && retryCount < 2 && url.includes('github.com')) {
        // Retry with different strategy
        console.log('[loadFileFromUrl] Retrying with strategy', retryCount + 1);
        setStatus(`加载失败，尝试其他方法... (${retryCount + 1}/3)`, true);
        setTimeout(() => loadFileFromUrl(url, retryCount + 1), 500);
      } else if (isRemoteUrl && retryCount === 2 && url.includes('github.com')) {
        // All strategies failed, show helpful message
        const instructions = `
⚠️ 无法加载远程 GitHub 文件（已尝试 3 种方法）
错误: ${e.message}

建议使用本地文件：
1. 将文件下载到本地
2. 使用页面上的"选择文件"按钮
3. 或使用相对路径，例如: ?file_url=assets/sample.rollout.jsonl

如果文件在仓库中：
访问: http://localhost:8000/index.html?file_url=assets/sample.rollout.jsonl

调试信息已输出到浏览器控制台（F12）
        `.trim();
        setStatus(instructions, false);
        statusEl.style.whiteSpace = 'pre-wrap';
      } else {
        setStatus(`加载失败: ${e.message}。请查看浏览器控制台（F12）获取详细信息。`, false);
      }
    }
  }

  // Load local file using FileReader API (for absolute paths via HTTP)
  async function loadLocalFileViaReader(absolutePath) {

  // Check for file_url parameter on page load
  (function checkUrlParams() {
    const urlParams = new URLSearchParams(window.location.search);
    const fileUrl = urlParams.get('file_url');

    if (fileUrl) {
      // Decode URL in case it's encoded
      let decodedUrl = decodeURIComponent(fileUrl);

      // Check if accessing from file:// protocol
      if (window.location.protocol === 'file:') {
        const isLocalPath = decodedUrl.startsWith('file://') || decodedUrl.startsWith('/') || /^[a-zA-Z]:[\/\\]/.test(decodedUrl);
        if (isLocalPath) {
          setStatus(`⚠️ 请使用 HTTP 服务器访问此页面以加载本地文件。运行: python -m http.server 8000，然后访问 http://localhost:8000/index.html`, false);
          statusEl.style.display = '';
          exitCompact();
          return;
        }
      }

      // Handle local absolute paths when served via HTTP
      if (window.location.protocol === 'http:' || window.location.protocol === 'https:') {
        // Strip file:// protocol if present
        if (decodedUrl.startsWith('file://')) {
          decodedUrl = decodedUrl.replace('file://', '');
        }

        // Check if it's an absolute path that won't work with simple HTTP server
        if (decodedUrl.startsWith('/') && !decodedUrl.startsWith('//') && !decodedUrl.startsWith(window.location.pathname.split('/')[1])) {
          // This is an absolute filesystem path, not a relative web path
          loadLocalFileViaReader(decodedUrl);
          return;
        } else if (/^[a-zA-Z]:[\/\\]/.test(decodedUrl)) {
          // Windows absolute path
          loadLocalFileViaReader(decodedUrl);
          return;
        }
      }

      // For relative paths or remote URLs
      loadFileFromUrl(decodedUrl);
    }
  })();
  </script>
  <script>
  // VS Code webview integration: when extension posts the JSONL content, auto-load and hide file UI
  (function(){
    try{
      const vscode = typeof acquireVsCodeApi==='function'?acquireVsCodeApi():null;
      // announce ready to extension to avoid race conditions
      const postReady = () => { try { vscode && vscode.postMessage({ type: 'ready' }); } catch(_){} };
      if (document.readyState === 'complete' || document.readyState === 'interactive') { postReady(); }
      else { window.addEventListener('DOMContentLoaded', postReady, { once: true }); }
      window.addEventListener('message', (event) => {
        const msg = event.data;
        if (!msg || msg.type !== 'load') return;
        const content = msg.content || '';
        // Hide file area & selector in editor-open scenario
        const hide = (id)=>{ const el=document.getElementById(id); if(el) el.style.display='none'; };
        // Also enforce via style to avoid re-showing
        try{
          if(!document.getElementById('vscode-hide-style')){
            const st=document.createElement('style'); st.id='vscode-hide-style'; st.textContent='#fileArea, #trajectorySelect { display: none !important; }'; document.head.appendChild(st);
          }
        }catch(_){ }
        hide('fileArea'); hide('trajectorySelect');
        if (typeof enterCompact==='function') enterCompact();
        try{
          const {steps,rawLines}=parseJSONL(content);
          const name = (function(){
            try{ const u=new URL(msg.uri); const p=u.pathname||''; return decodeURIComponent(p.split('/').pop()||'Active Document'); }catch{return 'Active Document';}
          })();
          state.files.clear();
          state.files.set(name,{steps,rawLines,mtime:Date.now()});
          state.currentFile=name; state.currentIndex=0;
          refreshFileSelect();
          try{ const st=document.getElementById('status'); if(st){ st.textContent=name; st.style.display=''; st.style.color='var(--muted)'; } }catch(_){ }
        }catch(err){
          console.error('Failed to parse injected JSONL, showing plain view',err);
          const root=document.getElementById('jsonl-root')||document.body;root.innerHTML='';
          const pre=document.createElement('pre');
          pre.textContent=String(content);
          root.appendChild(pre);
        }
      });
    }catch(e){/* ignore in plain browser */}
  })();
  </script>
