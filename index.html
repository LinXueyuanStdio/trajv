  /* Export dropdown */
  .dropdown-wrapper{position:relative;display:inline-flex;}

  .dropdown-wrapper.open .dropdown-arrow{transform:rotate(180deg);}
  .dropdown-menu{position:absolute;top:100%;left:0;margin-top:4px;background:var(--panel);border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.45),0 0 0 1px rgba(0,0,0,.15);padding:4px;min-width:160px;z-index:100;display:none;flex-direction:column;gap:2px;}

  .dropdown-menu button:hover{background:var(--accent);color:#fff;}
  /* Settings button */
  .settings-btn{display:inline-flex;align-items:center;justify-content:center;background:var(--panel-alt);border:1px solid var(--border);border-radius:6px;padding:.4rem .5rem;cursor:pointer;transition:background .18s,border-color .18s;color:var(--text);}
  .settings-btn:hover{background:var(--accent-hover);color:#fff;border-color:var(--accent-hover);}
  /* Compare control: the secondary stepper unfolds from the toggle's right edge. */
  .compare-control{display:inline-flex;align-items:center;min-width:0;isolation:isolate;--compare-stepper-width:216px;}
  .compare-toggle{height:30px;display:inline-flex;align-items:center;justify-content:center;padding:0 .7rem;white-space:nowrap;font-weight:600;letter-spacing:0;position:relative;z-index:2;transition:background-color .24s ease,border-color .24s ease,color .24s ease,box-shadow .32s ease,border-radius .42s cubic-bezier(.22,1,.36,1);}
  .compare-toggle[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 0 0 1px #ffffff12 inset,0 4px 14px #0004;border-radius:6px;}
  .compare-stepper-reveal{width:0;min-width:0;margin-left:0;overflow:clip;opacity:0;transform:translateX(-12px) scale(.965);transform-origin:left center;filter:blur(3px);pointer-events:none;transition:width .5s cubic-bezier(.22,1,.36,1),margin-left .5s cubic-bezier(.22,1,.36,1),opacity .24s ease .02s,transform .5s cubic-bezier(.22,1,.36,1),filter .28s ease;will-change:width,opacity,transform,filter;}
  .compare-stepper-content{width:var(--compare-stepper-width);height:32px;display:flex;align-items:center;gap:7px;padding:1px;white-space:nowrap;}
  .compare-stepper{flex:0 0 auto;width:max-content;box-shadow:0 5px 18px #0004;}
  .compare-stepper .stepper-display{padding-inline:8px;}
  .compare-control.active .compare-stepper-reveal{width:var(--compare-stepper-width);margin-left:6px;opacity:1;transform:translateX(0) scale(1);filter:blur(0);pointer-events:auto;transition:width .5s cubic-bezier(.22,1,.36,1),margin-left .5s cubic-bezier(.22,1,.36,1),opacity .3s ease .12s,transform .5s cubic-bezier(.22,1,.36,1),filter .34s ease .08s;}
  .compare-stepper .stepper-btn,.compare-stepper .stepper-display{opacity:0;transform:translateX(-4px);transition:opacity .2s ease,transform .32s cubic-bezier(.22,1,.36,1),background-color .15s,color .15s;}
  .compare-control.active .compare-stepper .stepper-btn,.compare-control.active .compare-stepper .stepper-display{opacity:1;transform:translateX(0);}
  .compare-control.active .compare-stepper>*:nth-child(1){transition-delay:.1s;}.compare-control.active .compare-stepper>*:nth-child(2){transition-delay:.13s;}.compare-control.active .compare-stepper>*:nth-child(3){transition-delay:.16s;}.compare-control.active .compare-stepper>*:nth-child(4){transition-delay:.19s;}.compare-control.active .compare-stepper>*:nth-child(5){transition-delay:.22s;}
  .auto-collapse-toggle{position:relative;display:inline-flex;align-items:center;justify-content:center;width:34px;height:22px;flex:0 0 34px;cursor:pointer;opacity:0;transform:translateX(-4px);transition:opacity .2s ease .22s,transform .32s cubic-bezier(.22,1,.36,1) .22s;}
  .compare-control.active .auto-collapse-toggle{opacity:1;transform:translateX(0);}
  .auto-collapse-toggle input{position:absolute;inline-size:1px;block-size:1px;opacity:0;pointer-events:none;}
  .auto-collapse-track{position:relative;width:32px;height:18px;border:1px solid var(--border);border-radius:999px;background:#20252b;box-shadow:0 1px 2px #0007 inset;transition:background-color .2s ease,border-color .2s ease,box-shadow .2s ease;}
  .auto-collapse-track::after{content:'';position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#a7adb4;box-shadow:0 1px 3px #0008;transition:transform .24s cubic-bezier(.22,1,.36,1),background-color .2s ease;}
  .auto-collapse-toggle input:checked+.auto-collapse-track{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 1px #ffffff18 inset,0 0 10px #3d82f638;}
  .auto-collapse-toggle input:checked+.auto-collapse-track::after{transform:translateX(14px);background:#fff;}
  .auto-collapse-toggle input:focus-visible+.auto-collapse-track{outline:2px solid #fff;outline-offset:2px;}
  /* Mac-style settings popover */
  .settings-popover{position:absolute;top:100%;right:0;margin-top:8px;background:var(--panel);border:1px solid var(--border);border-radius:10px;box-shadow:0 10px 32px rgba(0,0,0,.5),0 0 0 1px rgba(0,0,0,.2);padding:6px;min-width:180px;z-index:200;display:none;flex-direction:column;gap:2px;}
  .settings-popover.show{display:flex;}
  .settings-popover::before{content:'';position:absolute;top:-6px;right:14px;width:12px;height:12px;background:var(--panel);border:1px solid var(--border);border-right:none;border-bottom:none;transform:rotate(45deg);}
  .popover-section{display:flex;flex-direction:column;gap:1px;}

  .popover-option{display:flex;align-items:center;gap:.5rem;padding:.38rem .6rem;font-size:.75rem;border:none;background:transparent;border-radius:5px;color:var(--text);cursor:pointer;text-align:left;width:100%;}
  .popover-option:hover{background:var(--accent);color:#fff;}
  .popover-option .popover-check{width:1.2em;text-align:center;font-size:.7rem;color:var(--accent);visibility:hidden;}
  .popover-option.active .popover-check{visibility:visible;}
  .popover-option:hover .popover-check{color:#fff;}
  .popover-divider{height:1px;background:var(--border);margin:4px 6px;}
  /* Single column layout — let content flow naturally, page scrolls as one */
  .columns.single-col{flex-direction:column;flex:none;}
  .columns.single-col .col{flex:none;overflow:visible;}
  .columns.single-col #inputMessages,.columns.single-col #outputMessages{flex:none;overflow-y:visible;}
  /* Compare mode keeps two outer columns while stacking input/output inside each side. */
  .columns.compare-mode{flex-direction:row;overflow-x:auto;}
  .columns.compare-mode .col{flex:1 1 50%;overflow:hidden;}
  .columns.compare-mode .mode-buttons{display:none;}

  .columns.compare-mode .panel-header{min-height:31px;}
  .columns.compare-mode #inputMessages,.columns.compare-mode #outputMessages{display:flex;flex-direction:column;gap:.9rem;overflow-y:auto;}
  .compare-message-group{display:flex;flex-direction:column;gap:.45rem;min-width:0;}
  .compare-group-header{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:.45rem;min-height:28px;padding:.3rem .45rem;border:1px solid var(--border);border-radius:6px;background:color-mix(in srgb,var(--panel) 94%,transparent);box-shadow:0 5px 12px #0003;backdrop-filter:blur(8px);}
  .compare-group-title{font-size:.68rem;font-weight:650;color:var(--text);text-transform:uppercase;letter-spacing:.5px;}
  .diff-stats{margin-left:auto;display:flex;align-items:center;gap:.3rem;font:600 .58rem/1 ui-monospace,SFMono-Regular,Monaco,Menlo,Consolas,monospace;}
  .diff-stat{padding:3px 5px;border-radius:4px;background:#30363d;color:var(--muted);}
  .diff-stat.add{background:#173b25;color:#7ee787;}.diff-stat.remove{background:#4a1f24;color:#ff9b9b;}.diff-stat.change{background:#493b18;color:#f2cc60;}
  .compare-message-list{display:flex;flex-direction:column;gap:.5rem;min-width:0;}
  .compare-row-shell{min-width:0;display:flex;flex-direction:column;}

  .compare-row-placeholder{flex:1 0 auto;min-height:34px;border:1px dashed #3fb95055;border-left:3px solid #3fb95055;border-radius:6px;background:repeating-linear-gradient(-45deg,#17342144 0,#17342144 5px,transparent 5px,transparent 10px);}
  .compare-empty{padding:.65rem;border:1px dashed var(--border);border-radius:6px;color:var(--muted);font-size:.68rem;text-align:center;}
  .message.diff-added{border-color:#2f7d46;border-left:3px solid #3fb950;background:linear-gradient(90deg,#193623 0,var(--panel) 22%);}
  .message.diff-removed{border-color:#874047;border-left:3px solid #f85149;background:linear-gradient(90deg,#432126 0,var(--panel) 22%);}
  .message.diff-changed{border-color:#8b7329;border-left:3px solid #d29922;background:linear-gradient(90deg,#3b321b 0,var(--panel) 22%);}
  .message.diff-ghost{opacity:.72;filter:saturate(.78);}
  .diff-badge{margin-left:auto;padding:2px 6px;border-radius:4px;font-size:.52rem;font-weight:700;letter-spacing:.35px;color:#fff;}
  .diff-badge.added{background:#238636;}.diff-badge.removed{background:#b62324;}.diff-badge.changed{background:#9e6a03;}
  .structured-diff{border:1px solid #ffffff17;border-radius:5px;background:#11161b;overflow:hidden;}
  .structured-diff>summary{cursor:pointer;padding:.35rem .5rem;color:#c9d1d9;font-size:.62rem;user-select:none;background:#20262c;}
  .structured-diff-list{display:flex;flex-direction:column;max-height:280px;overflow:auto;}
  .structured-diff-row{display:grid;grid-template-columns:minmax(100px,32%) minmax(0,1fr);gap:.55rem;padding:.35rem .5rem;border-top:1px solid #30363d;font:normal .61rem/1.35 ui-monospace,SFMono-Regular,Monaco,Menlo,Consolas,monospace;}
  .structured-diff-path{color:#8ab4f8;overflow-wrap:anywhere;}.structured-diff-value{margin:0;padding:0;border:0;background:transparent;max-height:none;white-space:pre-wrap;overflow-wrap:anywhere;color:#c9d1d9;}

  /* Message font size */

  .settings-btn-wrapper{position:relative;display:inline-flex;} #dropzone{border:2px dashed var(--border); margin:.25rem 1rem 0; padding:.75rem; text-align:center; font-size:.8rem; color:var(--muted); border-radius:6px;} #dropzone.dragover{border-color:var(--accent); color:var(--accent); background:#1b283b;} .footer{padding:.5rem .75rem; font-size:.65rem; text-align:right; color:var(--muted); border-top:1px solid var(--border);} .edited-flag{color:var(--accent);} @media (max-width:1100px){.columns{flex-direction:column;flex:none;}.columns .col{flex:none;overflow:visible;}.columns #inputMessages,.columns #outputMessages{flex:none;overflow-y:visible;}}
  /* Equal columns & wrapping adjustments */
  .columns{align-items:stretch;}
  .col{min-width:0;}

  /* --- New JSON tree viewer styles --- */
  .json-tree{font-family:ui-monospace,monospace;font-size:.68rem;line-height:1.28;position:relative;}
  .json-tree ul{list-style:none;margin:0;padding:0 0 0 1rem;border-left:1px solid #2a3238;}

  .json-tree .jt-toggle::before{content:'▼';transition:transform .18s ease;}

  .json-tree .jt-key{color:#8ab4f8;}

    async function parseJSONLStream(stream,onProgress,options={}){
      const signal=options.signal;
      const onStep=options.onStep;
      const totalBytes=Number(options.totalBytes)||0;
      const reader = stream.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      const steps=[];
      let lineNo=0;
      let lastTick=0;
      let lastYield=0;
      let lastStepTick=0;
      let loadedBytes=0;
      function pushLine(line){
        const trimmed=line.trim();
        if(!trimmed) return;
        try{
          const obj=JSON.parse(trimmed);
          steps.push(normalizeRolloutStep(obj,steps.length));
        }catch(e){ console.warn('跳过无效 JSON 行',lineNo,e); }
      }
      try{
      while(true){
        throwIfAborted(signal);
        const {value,done}=await reader.read();
        throwIfAborted(signal);
        if(done)break;
        loadedBytes += value ? value.byteLength : 0;
        buffer += decoder.decode(value,{stream:true});
        let idx;
        while((idx=buffer.indexOf('\n'))!==-1){
          const line = buffer.slice(0,idx);
          buffer = buffer.slice(idx+1);
          lineNo++;
          pushLine(line);
          if(lineNo%1000===0){
            throwIfAborted(signal);
            const now=performance.now();
            if(now-lastYield>16){lastYield=now;await yieldToBrowser();}
          }
        }
        const now=performance.now();
        if(typeof onProgress==='function' && now-lastTick>200){
          lastTick=now;
          try{ onProgress({lines:lineNo,steps:steps.length,loadedBytes,totalBytes}); }catch{}
        }
        if(typeof onStep==='function' && steps.length>0 && now-lastStepTick>200){
          lastStepTick=now;
          try{ onStep(steps); }catch{}
        }
      }
      buffer += decoder.decode();
      if(buffer.length){ lineNo++; pushLine(buffer); }
      if(typeof onProgress==='function'){
        try{ onProgress({lines:lineNo,steps:steps.length,loadedBytes:totalBytes||loadedBytes,totalBytes,done:true}); }catch{}
      }
      if(typeof onStep==='function' && steps.length>0){
        try{ onStep(steps); }catch{}
      }
      return {steps};
      }catch(e){
        if(isAbortError(e)){try{await reader.cancel();}catch{}}
        throw e;
      }finally{
        try{reader.releaseLock();}catch{}
      }
    }

    function parseJSONL(text){

      for(let i=0;i<lines.length;i++){

    async function parseJSONLText(text,onProgress,options={}){
      const signal=options.signal;
      const onStep=options.onStep;
      const totalBytes=Number(options.totalBytes)||new TextEncoder().encode(text).byteLength;
      const lines=text.split(/\r?\n/);
      const steps=[];
      let loadedBytes=0,lastTick=0,lastStepTick=0,lastYield=0;
      for(let i=0;i<lines.length;i++){
        throwIfAborted(signal);
        const line=lines[i];
        loadedBytes+=line.length+1;
        if(!line.trim())continue;
        try{steps.push(normalizeRolloutStep(JSON.parse(line),steps.length));}
        catch(e){console.warn('跳过无效 JSON 行',i+1,e);}
        const now=performance.now();
        if(typeof onProgress==='function'&&now-lastTick>200){
          lastTick=now;
          try{onProgress({lines:i+1,steps:steps.length,loadedBytes:Math.min(loadedBytes,totalBytes),totalBytes});}catch{}
        }
        if(typeof onStep==='function'&&steps.length>0&&now-lastStepTick>200){
          lastStepTick=now;
          try{onStep(steps);}catch{}
        }
        if(now-lastYield>16){lastYield=now;await yieldToBrowser();}
      }
      if(typeof onProgress==='function'){
        try{onProgress({lines:lines.length,steps:steps.length,loadedBytes:totalBytes,totalBytes,done:true});}catch{}
      }
      if(typeof onStep==='function'&&steps.length>0){
        try{onStep(steps);}catch{}
      }
      return {steps};
    }

  // Load file from URL parameter (supports both remote URLs and local file:// paths)
  async function loadFileFromUrl(url, retryCount = 0) {
    try {
      const isLocalFile = url.startsWith('file://') || url.startsWith('/');
      const displayUrl = isLocalFile ? url.replace('file://', '') : url;

      console.log('[loadFileFromUrl] Loading:', url, 'retry:', retryCount);
      setStatus(`正在加载文件: ${displayUrl}`, true);
      statusEl.style.display = '';

      let fetchUrl = url;

      // For GitHub URLs, try multiple strategies
      if (url.includes('github.com')) {
        if (retryCount === 0) {
          // Strategy 1: Convert to jsdelivr CDN
          const githubMatch = url.match(/github\.com\/([^\/]+)\/([^\/]+)\/(?:blob|raw)\/(?:refs\/heads\/)?([^\/]+)\/(.+)/);
          if (githubMatch) {
            const [, user, repo, branch, path] = githubMatch;
            fetchUrl = `https://cdn.jsdelivr.net/gh/${user}/${repo}@${branch}/${path}`;
            console.log('[loadFileFromUrl] Using jsdelivr:', fetchUrl);
            setStatus(`正在通过 jsdelivr CDN 加载...`, true);
          }
        } else if (retryCount === 1) {
          // Strategy 2: Use raw.githubusercontent.com
          const githubMatch = url.match(/github\.com\/([^\/]+)\/([^\/]+)\/(?:blob|raw)\/(?:refs\/heads\/)?([^\/]+)\/(.+)/);
          if (githubMatch) {
            const [, user, repo, branch, path] = githubMatch;
            fetchUrl = `https://raw.githubusercontent.com/${user}/${repo}/${branch}/${path}`;
            console.log('[loadFileFromUrl] Using raw.githubusercontent:', fetchUrl);
            setStatus(`正在通过 raw.githubusercontent.com 加载...`, true);
          }
        } else if (retryCount === 2) {
          // Strategy 3: Direct fetch with no-cors mode as last resort
          fetchUrl = url.replace('/blob/', '/raw/');
          console.log('[loadFileFromUrl] Direct raw fetch:', fetchUrl);
          setStatus(`正在直接加载...`, true);
        }
      }

      console.log('[loadFileFromUrl] Fetching:', fetchUrl);
      const response = await fetch(fetchUrl, {
        mode: 'cors',
        cache: 'default'
      });

      console.log('[loadFileFromUrl] Response status:', response.status, response.statusText);
      if (!response.ok) {
        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
      }

      const blob = await response.blob();
      console.log('[loadFileFromUrl] Blob size:', blob.size, 'type:', blob.type);

      const filename = url.split('/').pop().split('?')[0] || 'loaded.rollout.jsonl';

      // Create a File object from the blob
      const file = new File([blob], filename, { type: 'application/jsonl' });

      setStatus(`正在解析: ${filename}`, true);
      const {steps} = await parseJSONLFile(file, (p) => {
        setStatus(`解析 ${filename} … ${p.steps || 0} steps`, true);
      });

      console.log('[loadFileFromUrl] Parsed steps:', steps.length);
      const mtime = Date.now();
      state.files.set(filename, {steps, mtime});
      state.currentFile = filename;

      refreshFileSelect();
      completeLoadProgress(filename, blob.size, steps.length, url);
      enterCompact();
    } catch (e) {
      console.error('[loadFileFromUrl] Error:', e);
      const isLocalFile = url.startsWith('file://') || url.startsWith('/');
      const isRemoteUrl = url.startsWith('http://') || url.startsWith('https://');

      if (isLocalFile && (e.message.includes('Failed to fetch') || e.message.includes('NetworkError'))) {
        setStatus(`⚠️ 浏览器安全限制：无法直接访问本地文件。请使用 HTTP 服务器访问此页面（如: python -m http.server 8000），然后使用相对路径或上方按钮选择文件。`, false);
      } else if (isRemoteUrl && retryCount < 2 && url.includes('github.com')) {
        // Retry with different strategy
        console.log('[loadFileFromUrl] Retrying with strategy', retryCount + 1);
        setStatus(`加载失败，尝试其他方法... (${retryCount + 1}/3)`, true);
        setTimeout(() => loadFileFromUrl(url, retryCount + 1), 500);
      } else if (isRemoteUrl && retryCount === 2 && url.includes('github.com')) {
        // All strategies failed, show helpful message
        const instructions = `
⚠️ 无法加载远程 GitHub 文件（已尝试 3 种方法）
错误: ${e.message}

建议使用本地文件：
1. 将文件下载到本地
2. 使用页面上的"选择文件"按钮
3. 或使用相对路径，例如: ?file_url=assets/sample.rollout.jsonl

如果文件在仓库中：
访问: http://localhost:8000/index.html?file_url=assets/sample.rollout.jsonl

调试信息已输出到浏览器控制台（F12）
        `.trim();
        setStatus(instructions, false);
        statusEl.style.whiteSpace = 'pre-wrap';
      } else {
        setStatus(`加载失败: ${e.message}。请查看浏览器控制台（F12）获取详细信息。`, false);
      }
    }
  }

  // Check for file_url parameter on page load
  (function checkUrlParams() {
    const urlParams = new URLSearchParams(window.location.search);
    const fileUrl = urlParams.get('file_url');

    if (fileUrl) {
      // Decode URL in case it's encoded
      let decodedUrl = decodeURIComponent(fileUrl);

      // Check if accessing from file:// protocol
      if (window.location.protocol === 'file:') {
        const isLocalPath = decodedUrl.startsWith('file://') || decodedUrl.startsWith('/') || /^[a-zA-Z]:[\/\\]/.test(decodedUrl);
        if (isLocalPath) {
          setStatus(`⚠️ 请使用 HTTP 服务器访问此页面以加载本地文件。运行: python -m http.server 8000，然后访问 http://localhost:8000/index.html`, false);
          statusEl.style.display = '';
          exitCompact();
          return;
        }
      }

      // Handle local absolute paths when served via HTTP
      if (window.location.protocol === 'http:' || window.location.protocol === 'https:') {
        // Strip file:// protocol if present
        if (decodedUrl.startsWith('file://')) {
          decodedUrl = decodedUrl.replace('file://', '');
        }

        // Check if it's an absolute path that won't work with simple HTTP server
        if (decodedUrl.startsWith('/') && !decodedUrl.startsWith('//') && !decodedUrl.startsWith(window.location.pathname.split('/')[1])) {
          // This is an absolute filesystem path, not a relative web path
          loadLocalFileViaReader(decodedUrl);
          return;
        } else if (/^[a-zA-Z]:[\/\\]/.test(decodedUrl)) {
          // Windows absolute path
          loadLocalFileViaReader(decodedUrl);
          return;
        }
      }

      // For relative paths or remote URLs
      loadFileFromUrl(decodedUrl);
    }
  })();

      const vscode = window.__trajvVscodeApi || (typeof acquireVsCodeApi==='function'?acquireVsCodeApi():null);

      // announce ready to extension to avoid race conditions
      const postReady = () => { try { vscode && vscode.postMessage({ type: 'ready' }); } catch(_){} };
      if (document.readyState === 'complete' || document.readyState === 'interactive') { postReady(); }
      else { window.addEventListener('DOMContentLoaded', postReady, { once: true }); }
      window.addEventListener('message', async (event) => {
        const msg = event.data;
        if(!msg)return;
        if(msg.type === 'loadFolder'){
          initializeFolderManifest(msg);

        if(msg.type === 'loadUri'){

        if(msg.type === 'load'){

        if(msg.type === 'loadError'){

          setStatus(`加载失败: ${msg.message||'unknown error'}`,false);
